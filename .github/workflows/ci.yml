name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Install Linux build deps (for flutter pub get)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Flutter version
        run: flutter --version
      - name: Flutter pub get (app)
        run: |
          cd app/progressor
          flutter pub get
      - name: Analyze
        run: |
          cd app/progressor
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: |
          cd app/progressor
          flutter test --no-pub

  build-linux:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Flutter version
        run: flutter --version
      - name: Flutter pub get (app)
        run: |
          cd app/progressor
          flutter pub get
      - name: Build Linux release
        run: |
          cd app/progressor
          flutter build linux --release
      - name: Upload Linux release bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-bundle
          path: app/progressor/build/linux/x64/release/bundle/
          retention-days: 7

  build-android-prepare:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Flutter version
        run: flutter --version
      - name: Flutter pub get (app)
        run: |
          cd app/progressor
          flutter pub get
      - name: Configure release signing (CI secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Keystore + passwords live only in GitHub Actions secrets (never in git).
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::No signing secrets (fork PR?) - APK will be debug-signed and must not be published."
              echo "ANDROID_ALLOW_DEBUG_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set; refusing to build a debug-signed release APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "ANDROID_REQUIRE_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
      - name: Build Android arm64 APK (Obtainium)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd app/progressor
          # Obtainium compares versionCode. We previously published versionCode 100,
          # so codes must stay strictly above that. Use 1000 + run_number.
          # Also set build-name so the OS version string is not stuck at 0.1.0.
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          flutter build apk --release --target-platform android-arm64 \
            --build-number=$VERSION_CODE \
            --build-name=0.2.${{ github.run_number }}
      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for APK in $(find app/progressor -name '*.apk' -path '*release*'); do
            echo "== $APK"
            "$APKSIGNER" verify --verbose --print-certs "$APK" | grep -E 'Verified using|Signer #1 certificate (DN|SHA-256)'
          done
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          path: app/progressor/build/app/outputs/flutter-apk/
          retention-days: 7

  deploy-continuous:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [analyze-test, build-linux, build-android-prepare]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-arm64-apk
          path: apk-artifacts

      - name: Download Linux bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-release-bundle
          path: linux-artifacts

      - name: Prepare APK + version.json (Obtainium) first
        # Publish APK even if Flatpak later fails — this was blocking updates.
        run: |
          set -euo pipefail
          ORIG_APK=$(find apk-artifacts -name '*.apk' | head -1)
          test -n "$ORIG_APK"
          mv "$ORIG_APK" apk-artifacts/progressor-arm64-v8a.apk
          echo "APK=apk-artifacts/progressor-arm64-v8a.apk" >> "$GITHUB_ENV"
          echo "APK_BASENAME=progressor-arm64-v8a.apk" >> "$GITHUB_ENV"
          VERSION="0.2.${{ github.run_number }}"
          # Keep in sync with build-android-prepare (must exceed legacy versionCode 100).
          VERSION_CODE=$((1000 + ${{ github.run_number }}))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          # Prefer gh-pages hosted APK URL (stable; avoids Obtainium pseudo-version issues
          # with release asset redirects). Same pattern as Flowlog.
          ./tool/generate_version_json.sh \
            --apk apk-artifacts/progressor-arm64-v8a.apk \
            --out version.json \
            --url "https://raw.githubusercontent.com/isyourbrainfoss/Progressor/gh-pages/progressor-arm64-v8a.apk" \
            --version "$VERSION" \
            --versionCode "$VERSION_CODE"

          cat version.json

      - name: Prepare Linux bundle for Flatpak script
        run: |
          set -euo pipefail
          mkdir -p app/progressor/build/linux/x64/release/bundle
          cp -r linux-artifacts/* app/progressor/build/linux/x64/release/bundle/
          if [ -f app/progressor/build/linux/x64/release/bundle/progressor ]; then
            chmod +x app/progressor/build/linux/x64/release/bundle/progressor
          fi
          ls -la app/progressor/build/linux/x64/release/bundle/ | head -20

      - name: Install Flatpak tools and SDK
        continue-on-error: true
        id: flatpak_sdk
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # GNOME 48 is EOL on Flathub in some runners; try 48 then 49.
          flatpak install --user -y flathub org.gnome.Sdk//48 org.gnome.Platform//48 \
            || flatpak install --user -y flathub org.gnome.Sdk//49 org.gnome.Platform//49

      - name: Build Flatpak repo
        continue-on-error: true
        id: flatpak_build
        run: ./flatpak/build-flatpak.sh

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Publish Obtainium assets + optional Flatpak to gh-pages
        run: |
          set -euo pipefail
          cd gh-pages
          git fetch origin gh-pages
          git reset --hard origin/gh-pages
          touch .nojekyll

          # Always publish APK + version.json so Obtainium can update.
          cp ../apk-artifacts/progressor-arm64-v8a.apk ./progressor-arm64-v8a.apk
          cp ../version.json .

          # Flatpak repo if built
          if [ -d ../repo ]; then
            mkdir -p repo
            cp -r ../repo/* repo/
          fi
          if [ -f ../progressor.flatpakrepo ]; then
            cp ../progressor.flatpakrepo .
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Deploy continuous ${{ env.VERSION }} (${{ github.sha }})" || echo "No changes"
          git push origin gh-pages

      - name: Create or update continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous ${{ env.VERSION }}
          body: |
            Automated build `${{ env.VERSION }}` (versionCode ${{ env.VERSION_CODE }}) from `${{ github.sha }}`.

            **Obtainium (recommended):** add this Standard JSON URL:
            ```
            https://raw.githubusercontent.com/isyourbrainfoss/Progressor/gh-pages/version.json
            ```

            Direct APK (gh-pages mirror):
            ```
            https://raw.githubusercontent.com/isyourbrainfoss/Progressor/gh-pages/progressor-arm64-v8a.apk
            ```
          files: |
            ${{ env.APK }}
          draft: false
          prerelease: true
